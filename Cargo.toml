[package]
name = "rust-lt"
version = "0.1.0"
edition = "2021"

[lib]
name = "rust_lt"
path = "src/engine/mod.rs"

[[bin]]
name = "rust-lt"
path = "src/main.rs"

[dependencies]
# Async runtime
tokio = { version = "1.35", features = ["full"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"

# HTTP client
reqwest = { version = "0.11", features = ["json", "cookies", "stream"] }

# WebSocket
tokio-tungstenite = "0.21"

# Utilities
regex = "1.10"
rand = "0.8"
uuid = { version = "1.6", features = ["v4", "serde"] }
async-trait = "0.1"

# Logging
log = "0.4"
env_logger = "0.11"

# CLI
clap = { version = "4.4", features = ["derive"] }

# Error handling
thiserror = "1.0"
anyhow = "1.0"

# Date/Time
chrono = { version = "0.4.42", features = ["serde"] }

# CSV parsing
csv = "1.3"

# Columnar / Parquet storage for crash-safe logging (Arrow latest to avoid chrono quarter ambiguity fixes)
parquet = { version = "54", features = ["arrow"] }
arrow = "54"
arrow-array = "54"
arrow-schema = "54"
tdigest = "0.2"
duckdb = { version = "1.4.2", features = ["bundled"] }

# Optional: Database support (uncomment when implementing JDBC feeder)
# sqlx = { version = "0.7", features = ["runtime-tokio", "postgres", "mysql", "sqlite"] }

# Optional: Redis support (uncomment when implementing Redis feeder)
# redis = { version = "0.24", features = ["tokio-comp", "connection-manager"] }

# Optional: Kafka support (uncomment when implementing Kafka feeder)
# rdkafka = { version = "0.36", features = ["tokio"] }

# Optional: JMS support (requires Java bindings)
# jni = "0.21"

[dev-dependencies]
# Testing
tokio-test = "0.4"
mockito = "1.2"
tempfile = "3.8"
