scenario:
  name: Dashboard Test - Quick Demo

  load_model:
    type: constant
    duration: 10
    users: 3

  feeders:
    name_data:
      type: csv
      name: name
      path: data/names.csv
      strategy: cyclic

  steps:
    - action: feed
      feeder: name_data

    - action: request
      protocol: http_request
      name: test_request
      method: GET
      url: http://httpbin.org/delay/1
      checks:
        - type: status
          expected: 200

    - action: wait
      duration: 500
